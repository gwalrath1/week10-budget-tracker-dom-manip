<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>Budget Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

</head>

<body class="p-3 mb-2 bg-primary bg-opacity-75">


  <div class="overall container rounded-4 shadow-lg rounded p-3 my-5">
    <h1 class="ms-2 text-primary-emphasis">Budget Tracker</h1>

   <!-- <div id="balance" class="ms-2">Balance $0.00</div>  -->

    <!-- BUDGET TABLE -->
    <div class="row">
      <div class="col-lg-7 container-md rounded-4 shadow-lg p-3 mb-5 rounded bg-primary-subtle table-responsive">
        <table  class="table table-sm  mt-2 table-primary text-body-tertiary">
          <thead>
            <tr id="purchases-row">
              <th scope="col">Purchase</th>
              <th scope="col">Amount</th>
              <th scope="col">Date</th>
              <th scope="col">Category</th>
              <th scope="col">income/expense</th>
            </tr>
          </thead>
          <tbody id="transactionsList" class="table-group-divider">
            <!-- DUMMY TRANSACTIONS -->
             <!--
            <tr>
              <td>Uber</td>
              <td>34.50</td>
              <td>3/15/2026</td>

                <button class="delete-btn">

                        d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0" />
                  </svg>

              </td>
            </tr>
            -->
          </tbody>
        </table>



        <!-- BUDGET PIE CHART AND SUMMARY TABLE-->
        <div class="chart-and-summary">

          <!-- SUMMARY TABLE -->
          <table id="summary-table" class="table w-50 mt-4">
            <thead>
              <tr>
                <th scope="col">Total Income:</th>
                <td id="total-income"></td>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">Total Expenses:</th>
                <td id="total-expenses"></td>
              </tr>
              <tr>
                <th scope="row">Balance:</th>
                <td id="balance"></td>
              </tr>
            </tbody>
          </table>

          <!-- BUDGET PIE CHART -->

          <canvas id="myChart" style="width:100%;max-width:600px"></canvas>

        </div>

      </div>

      <!-- SPACING COLUMN -->

      <div class="col-lg-auto"></div>

      <!-- ADD PURCHASE FORM -->
      <div id="formContainer"
        class="col-lg-4 container-md rounded-4 shadow-lg p-3 mb-5 rounded bg-primary-subtle text-primary-emphasis">
        <h4>Add purchases:</h4>

        <form id="purchases-form">
          <div class="mb-3">
            <label for="purchase" class="form-label fw-medium">Purchase Name</label>
            <!-- alright what the fuck is for. Or just label. tf is label dude. -->
            <input id="name" type="text" class="form-control" aria-describedby="purchase name" required>
            <!-- aria-describedby basically means give context to this part of the form -->
          </div>
          <div class="mb-3">
            <label for="amount" class="form-label fw-medium">Amount</label>
            <input id="amount" type="number" class="form-control" aria-describedby="amount of purchase" required>
          </div>
          <div class="mb-3">
            <label for="date" class="form-label fw-medium">Date</label>
            <input id="date" type="date" id="date" class="form-control" aria-describedby="date of purchase">
          </div>

          <!-- CATEGORY OF PURCHASE -->
          <label for="date" class="form-label fw-medium">Category</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="categories" id="exampleRadios1" value="home-utilities"
              checked>
            <label class="form-check-label" for="exampleRadios1">
              Home/Utilities
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="categories" id="exampleRadios2" value="transportation">
            <label class="form-check-label" for="exampleRadios2">
              Transportation
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="categories" id="exampleRadios2" value="groceries">
            <label class="form-check-label" for="exampleRadios2">
              Groceries
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="categories" id="exampleRadios2" value="insurance">
            <label class="form-check-label" for="exampleRadios2">
              Insurance
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="categories" id="exampleRadios2" value="restaurants-shopping-entertainment">
            <label class="form-check-label" for="exampleRadios2">
              Restaurants, Shopping, and Entertainment
            </label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="categories" id="exampleRadios2" value="income">
            <label class="form-check-label" for="exampleRadios2">
              Income
            </label>
          </div>

          <!-- INCOME OR EXPENSE -->
          <div class="mt-4 mb-4">
            <select id="type" class="form-select" aria-label="select income or expense">
              <option selected>Select Income or Expense...</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <div class="d-grid gap-2">
            <button id="add-purchases-button" type="button" class="btn btn-primary">Add</button>
          </div>
        </form>

        <!-- ADD BUDGET FORM -->

          <div class="d-grid gap-2">
            <button id="budget-button" type="button" class="btn btn-primary">Add</button>
          </div>
        </form>
        -->

      </div>



    </div>
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
